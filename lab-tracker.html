}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzipAll(buf) {
  const b = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder(), out = {};
  let e = b.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('This is not a valid .xlsx file.');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(b.subarray(p + 46, p + 46 + nlen)); p += 46 + nlen + xlen + clen;
    if (!/^xl\/(worksheets\/[^/]+\.xml|sharedStrings\.xml|workbook\.xml)$/.test(name)) continue;
    const ds = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true), raw = b.subarray(ds, ds + csize);

// -> array of rows (arrays of strings) from the first worksheet
async function readXlsx(buf) {
  const f = await unzipAll(buf), dp = new DOMParser();
  const sheetName = Object.keys(f).filter(n => n.startsWith('xl/worksheets/')).sort()[0];
  if (!sheetName) throw new Error('No worksheet found in the file.');
  const sst = f['xl/sharedStrings.xml'] ? [...dp.parseFromString(f['xl/sharedStrings.xml'], 'application/xml').getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const rows = [];
  for (const row of dp.parseFromString(f[sheetName], 'application/xml').getElementsByTagName('row')) {
    const r = [];
    for (const c of row.getElementsByTagName('c')) {
      const col = (c.getAttribute('r') || '').replace(/\d+/g, ''); let ci = 0; for (const ch of col) ci = ci * 26 + ch.charCodeAt(0) - 64; ci = Math.max(0, ci - 1);

      r[ci] = t === 's' ? (sst[+v] ?? '') : t === 'inlineStr' ? [...c.getElementsByTagName('t')].map(x => x.textContent).join('') : v;
    }
    rows.push(Array.from(r, x => x ?? ''));
  }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

// Apple coverage. Apple's public coverage page (checkcoverage.apple.com) is one serial at a time and protected by a CAPTCHA, so it can't be
// automated. Two practical routes: (1) Apple School / Business Manager, which shows AppleCare coverage for devices bought through Apple or a
// reseller and accepts a pasted list of serials; (2) an assisted worklist here: copy serial -> open Apple -> type the date -> next.
const APPLE_COVERAGE_URL = 'https://checkcoverage.apple.com/?locale=en_US';
const isApple = d => d.platform === 'Mac' || /apple/i.test(d.manufacturer || '') || /^(imac|mac ?mini|mac ?studio|mac ?pro|macbook)/i.test(d.model || '');

function appleCoverageDialog(ids, startOne) {

  if (ids) sets.unshift(['sel', 'Only the devices I selected', all.filter(d => ids.includes(d.id))]);
  let scope = sets[0][0], mode = startOne ? 'one' : 'bulk', i = 0;

        <p class="small muted">Apple’s page asks for a CAPTCHA on every lookup, so this keeps the routine quick: the serial is copied for you; paste it into Apple’s page, solve the CAPTCHA, then type the “coverage expires” date here.</p>
        <div class="card" style="background:var(--surface2)"><div class="small muted">${i + 1} of ${list.length}</div><div style="font-size:24px;font-weight:700;letter-spacing:.03em">${esc(d.serial)}</div><div class="muted">${esc(d.name)} · ${esc(d.model || '')}</div>
        <div class="chips" style="margin:10px 0"><button class="btn primary" data-open>Copy serial &amp; open Apple ↗</button></div>

        ${d.purchaseDate ? `<div class="chips" style="margin-top:8px"><span class="small muted">Estimate from purchase (${fmtDate(d.purchaseDate)}):</span><button class="chip" data-est="1">+1 year (limited warranty)</button><button class="chip" data-est="3">+3 years (AppleCare+)</button></div>` : ''}
        <div class="chips" style="margin-top:12px"><button class="btn" data-skip>Skip</button><button class="btn primary" data-save>Save &amp; next</button></div></div>`;
    }

}

function tcoReport(host) {

// ---- calendar export ----
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
const nextDay = s => { const x = parseD(s); x.setDate(x.getDate() + 1); return ymd(x); };
function buildICS(events) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', d8 = s => s.replace(/-/g, '');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Lab Asset Tracker//EN', 'CALSCALE:GREGORIAN',
    ...events.flatMap((e, i) => ['BEGIN:VEVENT', `UID:lt-${i}-${d8(e.date)}-${e.uid || i}@lab-tracker`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d8(e.date)}`, `DTEND;VALUE=DATE:${d8(nextDay(e.date))}`, `SUMMARY:${icsEscape(e.title)}`, e.desc ? `DESCRIPTION:${icsEscape(e.desc)}` : '', 'END:VEVENT'].filter(Boolean)),
    'END:VCALENDAR'].join('\r\n');
}
function calendarReport(host) {

  host.innerHTML = `<p class="muted small">Exports an <b>.ics</b> file that Outlook, Google Calendar or Apple Calendar can import (or subscribe to by saving it on the share). It is a snapshot – re-export after the plan changes.</p>
  <div class="card">${[['rep', 'Planned replacement dates (per lab)'], ['lic', 'Software license expirations'], ['war', 'Warranty ends (grouped per lab and month)'], ['proj', 'Project install windows'], ['black', 'Blackout windows']].map(([k, l]) => `<label class="chk" style="margin:6px 0"><input type="checkbox" data-c="${k}"${C[k] ? ' checked' : ''}> ${l}</label>`).join('')}<p><button class="btn primary" id="ics">${ic('download')} Download .ics</button></p></div>`;
  host.onchange = e => { if (e.target.dataset.c) C[e.target.dataset.c] = e.target.checked; };
  $('#ics', host).onclick = () => {
    const ev = [], t = todayStr();
    if (C.rep) DB.data.labs.forEach(lab => { const s = labStats(lab); if (s.next) ev.push({ date: s.next < t ? t : s.next, title: `Replacement due: ${labLabel(lab)}`, desc: `${s.qty} devices, ${money(s.cost)} estimated${s.next < t ? ' (overdue since ' + s.next + ')' : ''}`, uid: lab.id }); });
    if (C.lic) DB.data.software.filter(s => s.licenseExpiry).forEach(s => ev.push({ date: s.licenseExpiry, title: `License expires: ${s.name}`, desc: s.vendor || '', uid: s.id }));
    if (C.war) { const g = group(DB.data.devices.filter(d => d.warrantyEnd && d.warrantyEnd >= t), d => (d.labId || 'none') + '|' + d.warrantyEnd.slice(0, 7)); g.forEach((ds, k) => ev.push({ date: ds.map(d => d.warrantyEnd).sort()[0], title: `Warranty ends: ${ds.length} device(s) ${ds[0].labId ? 'in ' + labLabel(DB.get('labs', ds[0].labId)) : '(not in a lab)'}`, desc: ds.slice(0, 15).map(d => d.name).join(', '), uid: k })); }
    if (C.proj) DB.data.projects.filter(p => p.installStart).forEach(p => ev.push({ date: p.installStart, title: `Install starts: ${p.title}`, desc: `Status: ${p.status}`, uid: p.id }));
    if (C.black) (S().blackouts || []).forEach((b, i) => ev.push({ date: b.start, title: `Blackout starts: ${b.label}`, desc: `Through ${b.end}`, uid: 'b' + i }));
    if (!ev.length) return toast('Nothing to export for those choices.', 'err');
    download('lab-tracker.ics', buildICS(ev), 'text/calendar'); toast(`${ev.length} events exported`);
  };
}

const C128_STOP = '2331112';
function code128SVG(text, { h = 38, mod = 1.6 } = {}) {
  const vals = [104]; let chk = 104, pos = 0;
  for (const ch of String(text)) { const v = ch.charCodeAt(0) - 32; if (v < 0 || v > 95) continue; vals.push(v); chk += v * ++pos; }
  vals.push(chk % 103); let x = 10 * mod, bars = '';
  [...vals.map(v => C128[v]), C128_STOP].forEach(p => { for (let i = 0; i < p.length; i++) { const w = +p[i] * mod; if (i % 2 === 0) bars += `<rect x="${x.toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${h}"/>`; x += w; } });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${(x + 10 * mod).toFixed(1)} ${h}" preserveAspectRatio="none" style="width:100%;height:${h * 0.6}px" fill="#000">${bars}</svg>`;
}

// ---- 23-health.js
// Data safety: health check of the shared folder, "export everything", and the Settings card that ties them together.
async function runHealthChecks() {
  const st = DB.store, r = [], add = (n, ok, d, warn) => r.push({ n, ok, d, warn });
  add('Browser can use a shared folder', st.kind !== 'folder' || HAS_FSA, st.kind === 'folder' ? 'File System Access API available' : `Storage mode: ${st.kind}`);
  try {
    const disk = await readChecked(st);
    if (!disk) add('Data file is readable and consistent', false, 'The data file is missing.');
    else add('Data file is readable and consistent', true, `${totalRecords(disk.data)} records, version ${disk.data.rev}, ${(disk.text.length / 1024).toFixed(0)} KB, last saved ${disk.data.savedAt ? new Date(disk.data.savedAt).toLocaleString() : '—'} by ${disk.data.savedBy || '?'}`);
    if (disk) add('This browser is in sync with the file', disk.data.rev === DB.rev || DB.dirty(), `file version ${disk.data.rev}, loaded version ${DB.rev}${DB.dirty() ? ' (you have unsaved changes)' : ''}`, true);
  } catch (e) { add('Data file is readable and consistent', false, e.message); }
  add('Saving is not paused', !DB.halted, DB.halted ? 'Saving is paused by the integrity check – use “Resume saving” after fixing the cause.' : 'OK');
  add('Folder permission', !DB.readOnly, DB.readOnly ? 'View-only session' : 'Read and write');
  if (st.kind === 'folder') {
    try {
      const name = `healthcheck-${normKey(DB.user) || 'user'}.tmp`, stamp = String(Date.now()), t0 = performance.now();
      const w = await (await st.dir.getFileHandle(name, { create: true })).createWritable(); await w.write(stamp); await w.close();
      const back = await (await (await st.dir.getFileHandle(name)).getFile()).text(); await st.dir.removeEntry(name);
      add('Write, re-read and delete a test file', back === stamp, `round trip ${Math.round(performance.now() - t0)} ms`);
    } catch (e) { add('Write, re-read and delete a test file', false, e.message); }
    try { await st.acquire(); const ok = !!st._lock; await st.release(); add('Lock file works', ok, ok ? 'acquired and released' : 'could not take the lock – someone else may be saving; run again in a moment', !ok); } catch (e) { add('Lock file works', false, e.message); }
    try {
      const l = JSON.parse(await (await (await st.dir.getFileHandle(LOCK_FILE)).getFile()).text()); const age = (Date.now() - l.t) / 1000;
      add('No stale lock', age < 60, `a lock by ${l.u || '?'} is ${Math.round(age)} s old`, true);
    } catch { add('No stale lock', true, 'no lock file present'); }
    const bk = await st.listBackups();
    if (!bk.length) add('Daily backups', false, 'No backups yet – the first one is written when the first save of a day happens.', true);
    else {
      let ok = false, d = '';
      try { const t = JSON.parse(await st.readBackup(bk[0])); const probs = validateData(t); ok = !probs.length && totalRecords(t) > 0; d = `${bk.length} backups, newest ${bk[0].replace(/^lab-tracker-|\.json$/g, '')} (${totalRecords(t)} records)`; if (probs.length) d += ' – ' + probs.join('; '); } catch (e) { d = 'newest backup could not be read: ' + e.message; }
      const days = daysBetween(bk[0].replace(/^lab-tracker-|\.json$/g, ''), todayStr()); add('Daily backups', ok && days <= 3, d + (days > 3 ? ` – newest is ${days} days old` : ''), ok);
    }
    const imp = await st.listImports(); add('imports folder', true, imp.length ? `${imp.length} CSV file(s) present` : 'empty or not created (optional)');
  }
  return r;
}
async function healthDialog() {
  const body = document.createElement('div'); body.innerHTML = '<p class="muted">Running checks…</p>';
  modal({ title: 'Data safety health check', body, wide: true, buttons: [{ label: 'IT setup note', onClick: () => { download('lab-tracker-IT-note.txt', itNoteText(), 'text/plain'); return false; } }, { label: 'Two-computer save test…', onClick: () => { pilotDialog(); return false; } }, { label: 'Close', cls: 'primary' }] });
  const r = await runHealthChecks();
  body.innerHTML = `<table><thead><tr><th></th><th>Check</th><th>Result</th></tr></thead><tbody>${r.map(x => `<tr><td>${x.ok ? '<span class="badge ok">pass</span>' : x.warn ? '<span class="badge warn">warn</span>' : '<span class="badge bad">FAIL</span>'}</td><td>${esc(x.n)}</td><td class="small">${esc(x.d)}</td></tr>`).join('')}</tbody></table>
  <p class="small muted" style="margin-top:12px">Checks are done from this computer only. For a true multi-user test, run it from two computers, make edits on both at the same time, then run it again.</p>`;
}

const flat = v => Array.isArray(v) ? v.map(x => typeof x === 'object' ? JSON.stringify(x) : x).join('; ') : (v && typeof v === 'object') ? JSON.stringify(v) : v;
function tableCSV(rows, extra) {
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))].filter(k => !/^_/.test(k));
  const ex = Object.keys(extra ? extra(rows[0] || {}) : {});
  return toCSV([[...keys, ...ex], ...rows.map(r => [...keys.map(k => flat(r[k])), ...(extra ? Object.values(extra(r)) : [])])]);
}
function exportEverything() {
  const D = DB.data, L = id => id ? labLabel(DB.get('labs', id)) : '';
  const ex = {
    labs: r => ({ building_name: DB.get('buildings', r.buildingId)?.name || '' }), hardware: r => ({ lab_label: L(r.labId), model_name: modelName(r) }), devices: r => ({ lab_label: L(r.labId) }),

    projects: r => ({ lab_label: L(r.labId) }), confirmations: r => ({ lab_label: L(r.labId), contact_name: DB.get('contacts', r.contactId)?.name || '' }), audits: r => ({ lab_label: L(r.labId) })
  };
  const files = [['lab-tracker-data.json', JSON.stringify(D)]];

  files.push(['csv/activity-log.csv', '﻿' + toCSV([['When', 'Who', 'Action', 'Type', 'Item', 'Changes'], ...activityRows().map(r => [r.when, r.who, r.a, TABLE_LABEL[r.t] || '', r.n, r.f ? Object.entries(r.f).map(([k, [o, n]]) => `${k}: ${o} -> ${n}`).join('; ') : ''])])]);
  files.push(['csv/settings.json', JSON.stringify(D.settings, null, 2)]);
  files.push(['README.txt', `Lab Asset Tracker export\r\nCreated ${new Date().toLocaleString()} by ${DB.user}\r\nData version ${DB.rev}, ${totalRecords(D)} records\r\n\r\nlab-tracker-data.json is the complete database: it can be restored with Settings > Restore from backup.\r\ncsv/ holds one spreadsheet-friendly file per table (ids are internal; *_label / *_name columns are added for readability).\r\n`]);

function noticeState(p) {
  const lab = p.labId && DB.get('labs', p.labId); if (!lab) return { label: '', cls: '' };
  const last = (lab.notified || []).slice(-1)[0], cs = DB.data.confirmations.filter(c => c.labId === lab.id);
  if (cs.length && cs.every(c => c.status === 'Confirmed')) return { label: 'Confirmed', cls: 'ok' };
  if (last) return { label: 'Sent ' + fmtDate(last.date), cls: 'acc' };
  return { label: 'Not sent', cls: 'warn' };
}
const noticeBadge = p => { const s = noticeState(p); return s.label && (p.status || 'Planned') !== 'Complete' ? `<div style="margin-top:4px"><span class="badge ${s.cls}">Notice: ${esc(s.label)}</span></div>` : ''; };
// A lab should have been told once the project has a PO or an install date within 60 days.
const noticeDue = p => { const s = (p.status || 'Planned'); if (!p.labId || ['Complete', 'On hold'].includes(s) || noticeState(p).label !== 'Not sent') return false; const t = todayStr(); return PROJECT_STATUS.indexOf(s) >= 2 || (p.installStart && p.installStart <= addMonths(t, 2)); };

function advanceProjects() {
  const t = todayStr(); let n = 0;
  DB.data.projects.slice().forEach(p => {
    const cur = p.status || 'Planned'; if (cur === 'On hold') return;
    let target = 0;
    if (p.quoteDate || p.quoteNo) target = 1; if (p.poNo || p.poDate) target = 2;
    if (p.deliveryDate && p.deliveryDate <= t) target = 3; if (p.installStart && p.installStart <= t) target = 5; if (p.installEnd && p.installEnd <= t) target = 6;
    if (target > PROJECT_STATUS.indexOf(cur)) { DB.put('projects', { ...p, status: PROJECT_STATUS[target] }); n++; }
  });
  if (n) DB.log(`Moved ${n} project${n > 1 ? 's' : ''} forward from their dates`);
}

function closeOutProjects() {
  DB.data.projects.slice().forEach(p => {
    if ((p.status || 'Planned') !== 'Complete' || p.closedOut || !p.labId) return;
    const lab = DB.get('labs', p.labId); if (!lab) return;
    const date = p.installEnd || todayStr(), end = fyRange(p.fy || fiscalYear(todayStr()))[1], nm = p.newModelId && DB.get('models', p.newModelId);
    const lines = DB.data.hardware.filter(l => l.labId === lab.id && isActiveLine(l) && (plannedDate(l) || '9999') <= end);
    lines.forEach(l => {
      const history = [...(l.history || []), { date: l.lastReplaced || l.purchaseDate || '', model: modelName(l), qty: l.qty, unitCost: unitCostOf(l), funding: l.fundingSource || '', by: DB.user }];
      const ch = { ...l, history, lastReplaced: date, purchaseDate: date, plannedOverride: '', status: 'In service', warrantyEnd: '', fundingSource: p.fundingSource || l.plannedFunding || l.fundingSource || '', fundingRef: p.poNo || l.fundingRef || '', plannedFunding: '' };
      if (nm) { ch.modelId = nm.id; ch.platform = nm.platform || l.platform; if (+nm.unitCost) ch.unitCost = nm.unitCost; if (nm.os) ch.os = nm.os; }
      DB.put('hardware', ch);
    });
    DB.put('projects', { ...p, closedOut: { date, lines: lines.length, by: DB.user } });
    DB.log(`Project “${p.title}” complete: updated ${lines.length} hardware line(s) in ${labLabel(lab)} (replaced ${fmtDate(date)})`);
    toast(`${labLabel(lab)}: ${lines.length} hardware line(s) marked replaced`);
  });
}

// Pilot tools for the shared folder: a note for IT, and a two-computer save test that proves the lock file stops lost updates.
function itNoteText() {
  const st = DB.store, nm = st.kind === 'folder' ? st.name : '(not in folder mode)';
  return `Lab Asset Tracker - setup note for IT
Generated ${new Date().toLocaleString()} by ${DB.user}

WHAT IT IS
A single HTML file (lab-tracker.html) with no server, installer or internet access needed. It reads and writes one data file in a shared folder.

WHAT IT NEEDS
1. A folder on the network share (this one is "${nm}") containing lab-tracker.html.
2. Read AND write (create, modify, delete) permission on that folder for every person who edits. Read-only users can be given read permission only.
3. Users open lab-tracker.html in Microsoft Edge or Google Chrome (the File System Access API is required for shared-folder saving) and choose the folder once. The browser asks for permission again after it restarts or after a long time; that is normal.
4. The folder must be reachable as a normal path (mapped drive or UNC path such as \\\\server\\share\\LabTracker). SharePoint/OneDrive sync folders are not recommended: sync delays can cause conflicts.

FILES CREATED IN THE FOLDER
- lab-tracker-data.json       the database (the only file that matters)
- lab-tracker.lock            short-lived lock while someone saves (deleted automatically; stale after 15 s)
- backups\\                    one backup per day, the newest 60 are kept
- imports\\                    optional: drop exports here (intune-devices.csv, mosyle-devices.csv, labstats-stations.csv, labstats-usage.csv, warranty.csv, installed-apps.csv)

BACKUP AND RECOVERY
Include the whole folder in your normal share backups. To restore, copy a file from backups\\ over lab-tracker-data.json while nobody is editing. The tracker also offers the newest backup automatically if it finds a damaged data file.

LIMITS TO KNOW ABOUT
- It is a shared file, not a database server. It is designed for roughly 5-10 people editing occasionally.
- Anyone with write access to the folder can change or delete the data file or the HTML file. The in-app users and roles are for attribution, not security.
- Saving merges changes field by field, so two people editing different things is safe; two people editing the same field at once is last-writer-wins.

IF YOU NEED STRONGER GUARANTEES
Move the data to a small server (SQLite or Postgres) with Entra ID sign-in. The storage code is isolated in src/js/01-store.js.
`;
}
const PILOT_FILE = 'pilot-counter.json', pilotKey = () => `${DB.user} (${(UI.pilotId ??= uid().slice(0, 4))})`;
async function pilotReadCounter(st) { try { return JSON.parse(await (await (await st.dir.getFileHandle(PILOT_FILE)).getFile()).text()); } catch { return { n: 0, by: {} }; } }
async function pilotRun(st, rounds, tick) {
  for (let i = 0; i < rounds; i++) {
    await st.acquire();
    try {
      const c = await pilotReadCounter(st); c.n++; c.by[pilotKey()] = (c.by[pilotKey()] || 0) + 1;
      const w = await (await st.dir.getFileHandle(PILOT_FILE, { create: true })).createWritable(); await w.write(JSON.stringify(c)); await w.close();
    } finally { await st.release(); }
    tick(i + 1); await new Promise(r => setTimeout(r, 100 + Math.random() * 200));
  }

// Tiny trend line for tiles.
function sparkSVG(vals, w = 96, h = 28) {
  if (vals.length < 2 || !vals.some(v => v)) return '';
  const mx = Math.max(...vals), mn = Math.min(...vals), rng = mx - mn || 1, X = i => 2 + (w - 4) * i / (vals.length - 1), Y = v => h - 3 - (h - 6) * (v - mn) / rng;
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="2,${h - 2} ${pts} ${w - 2},${h - 2}" fill="var(--accent-soft)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(vals.length - 1)}" cy="${Y(vals[vals.length - 1])}" r="3" fill="var(--accent)"/></svg>`;
}

// Whole numbers and whole-dollar tiles count up when a page opens.
function countUps(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $$('.kpi .v, .big-n', root).forEach(el => {
    const m = /^(\$?)([\d,]+)$/.exec(el.textContent.trim()); if (!m) return;
    const end = +m[2].replace(/,/g, ''), pre = m[1]; if (end < 5) return;
    const t0 = performance.now(), dur = 600;
    const step = t => { const k = Math.min(1, (t - t0) / dur), v = Math.round(end * (1 - Math.pow(1 - k, 3))); el.textContent = pre + v.toLocaleString(); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

        ${card('ad-wr', 'Assets by warranty status')}${card('ad-wm', 'Assets by warranty expiry month')}</div>` },
      { id: 'where', title: 'Where assets are', html: `<div class="grid g2">${card('ad-bld', 'Assets by building')}${card('ad-top', 'Top models')}</div><div class="grid g3">${card('ad-os', 'Operating system support')}${card('ad-ci', 'Last check-in')}${card('ad-src', 'Source of record')}</div>` },
      { id: 'attn', title: 'Assets that need attention', html: `<div class="card">${attn.length ? `<div class="tbl-wrap"><table><thead><tr><th>Asset</th><th>Lab</th><th>Platform</th><th>Health</th><th>Why</th></tr></thead><tbody>${attn.map(x => `<tr data-go="${x.id}"><td><a href="#/device/${x.id}">${esc(x.name || x.serial || x.id)}</a><div class="small muted">${esc(x.model || '')}</div></td><td>${x.labId ? esc(labLabel(DB.get('labs', x.labId))) : '<span class="muted">Unassigned</span>'}</td><td>${esc(x.platform || '')}</td><td><span class="badge ${H.get(x.id).h === 'Critical' ? 'bad' : 'warn'}">${H.get(x.id).h}</span></td><td class="small">${esc(H.get(x.id).why.join(' · '))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Every asset is healthy.</div>'}</div>` }
    ];
    const tools = `<div class="card no-print"><div class="toolbar"><div class="field"><label>Platform</label><select id="ad-p"><option value="">All</option>${optionsHTML(PLATFORMS, A.platform)}</select></div><div class="field"><label>Building</label><select id="ad-b"><option value="">All</option>${optionsHTML(buildingOptions(), A.buildingId)}</select></div><label class="chk"><input type="checkbox" id="ad-a"${A.showArchived ? ' checked' : ''}> Include archived</label></div></div>`;
    el.innerHTML = pageHead('Asset overview', `<a class="btn" href="#/devices">All devices</a><button class="btn" onclick="window.print()">${ic('file')} Print</button>`, 'Asset overview') + tools + (devs.length || d0.devices.length ? dashLayout('assets', secs) : '<div class="card empty">No managed devices yet. Import Intune, Mosyle or LabStats exports to populate this page.</div>');
    $('#ad-p', el).onchange = e => { A.platform = e.target.value; render(); }; $('#ad-b', el).onchange = e => { A.buildingId = e.target.value; render(); }; $('#ad-a', el).onchange = e => { A.showArchived = e.target.checked; render(); };
    const put = (id, s) => { const h = $('#' + id, el); if (h) renderChart(h, s); };
    put('ad-st', spec('donut', st, 'Status')); put('ad-hl', spec('donut', hl, 'Health')); put('ad-wr', spec('hbar', wr, 'Warranty')); put('ad-wm', wm);
    put('ad-bld', spec('hbar', bld, 'Building', { w: 760 })); put('ad-top', spec('hbar', top, 'Model', { w: 760 })); put('ad-os', spec('donut', os, 'OS support')); put('ad-ci', spec('bar', ci, 'Check-in')); put('ad-src', spec('donut', src, 'Source'));
  }
};

</script>
</body>
