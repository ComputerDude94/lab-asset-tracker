<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Asset Tracker</title>
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--surface2:#f6f8fb;--border:#e2e6ee;--text:#1d2736;--muted:#687487;
  --accent:#2563eb;--accent-fg:#fff;--accent-soft:#e8efff;
  --danger:#c62828;--danger-soft:#fde8e8;--warn:#b45309;--warn-soft:#fff1d6;--ok:#15803d;--ok-soft:#dcf5e5;--info:#0369a1;--info-soft:#e0f2fe;
  --side:#141c2b;--side2:#1d2739;--side-text:#aab5c7;--side-head:#6c7a91;
  --c1:#2563eb;--c2:#e07b00;--c3:#12a37f;--c4:#a64ca6;--c5:#3aa6dc;--c6:#d1432b;--c7:#7a8a2b;--c8:#6b7280;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sw:240px;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e131b;--surface:#161d29;--surface2:#1b2432;--border:#273244;--text:#e5eaf2;--muted:#93a0b5;
  --accent:#6aa5ff;--accent-fg:#0b1220;--accent-soft:#1c2d4d;
  --danger:#ff8a80;--danger-soft:#3a2220;--warn:#f2c14e;--warn-soft:#3a3016;--ok:#6fd49a;--ok-soft:#173225;--info:#7cc4f0;--info-soft:#12303f;
  --side:#0a0f18;--side2:#141c2b;
  --c1:#5aa2ff;--c2:#ffa43a;--c3:#44d1a6;--c4:#d58ad5;--c5:#7cc4f0;--c6:#ff7d63;--c7:#b6c95a;--c8:#9aa0ad;--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .5em;line-height:1.25}h1{font-size:21px;font-weight:650}h2{font-size:17px}h3{font-size:14px;font-weight:650}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px}
.muted{color:var(--muted)}.right{text-align:right}.nowrap{white-space:nowrap}.small{font-size:12px}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
/* ---- layout ---- */
#app{display:block}
#side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--side);color:var(--side-text);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.main-col{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.06);color:#fff}
.logo{width:34px;height:34px;border-radius:9px;background:var(--logo-bg,linear-gradient(135deg,#3b82f6,#6366f1));color:var(--logo-fg,#fff);display:grid;place-items:center;font-size:18px;flex:none}
.bt{font-weight:650;line-height:1.15}.bt small{display:block;font-weight:400;font-size:11px;color:var(--side-head);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#nav{padding:10px 10px;overflow:auto;flex:1}
nav .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--side-head);padding:16px 12px 6px}
nav a{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;color:var(--side-text);margin-bottom:1px;text-decoration:none;font-weight:500;position:relative}
nav a .ic{font-size:17px;opacity:.85}
nav a:hover{background:var(--side2);color:#fff}
nav a.on{background:var(--side2);color:#fff}nav a.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--nav-accent,#60a5fa)}nav a.on .ic{color:var(--nav-accent,#60a5fa);opacity:1}
nav a .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.09);padding:1px 7px;border-radius:99px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:12px}
#sync{display:flex;align-items:center;gap:7px;color:var(--side-text)}
#sync .dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex:none}
#sync.busy .dot{background:#fbbf24}#sync.err .dot{background:#f87171}#sync.demo .dot{background:#60a5fa}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:58px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .spacer{flex:1}
.gsearch{position:relative;flex:1 1 140px;min-width:0;max-width:460px}
.gsearch input{width:100%;min-width:0;padding:8px 12px 8px 34px;border-radius:9px;border:1px solid var(--border);background:var(--surface2)}
.gsearch .ic{position:absolute;left:11px;top:11px;color:var(--muted)}
.gs-res{position:absolute;top:44px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:40}
.gs-res .gh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px 3px}
.gs-res a{display:flex;gap:8px;align-items:baseline;padding:7px 12px;color:var(--text);text-decoration:none}.gs-res a:hover,.gs-res a.sel{background:var(--accent-soft)}.gs-res .none{padding:14px;color:var(--muted)}
.user-btn{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--border);border-radius:99px;background:var(--surface);cursor:pointer}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:12px;font-weight:650}
main#view{padding:22px 26px 70px;min-width:0;flex:1}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}.crumbs a{color:var(--muted)}
.page-h{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.page-h h1{margin:0}.page-h .spacer{flex:1}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:500;text-decoration:none!important;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.sm{padding:4px 10px;font-size:12px}.btn.left{margin-right:auto}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.icon-btn{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:7px}.icon-btn:hover{background:var(--surface2)}
input,select,textarea{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.dd{position:relative;display:inline-block}.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:45}
.dd.open .dd-menu{display:block}.dd-menu a,.dd-menu label,.dd-menu button{display:flex;gap:9px;align-items:center;width:100%;padding:7px 10px;border-radius:7px;color:var(--text);background:none;border:0;cursor:pointer;text-align:left;text-decoration:none;font-weight:400}
.dd-menu a:hover,.dd-menu label:hover,.dd-menu button:hover{background:var(--surface2)}.dd-menu .dh{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 10px 2px}
.ro .edit-only{display:none!important}
/* ---- cards / stats ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.card-h h2,.card-h h3{margin:0}.card-h .spacer{flex:1}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:13px;align-items:center;color:var(--text);text-decoration:none!important;min-width:0}
a.kpi:hover{border-color:var(--accent)}
.kpi .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--accent-soft);color:var(--accent)}
.kpi.bad .ico{background:var(--danger-soft);color:var(--danger)}.kpi.warnk .ico{background:var(--warn-soft);color:var(--warn)}.kpi.good .ico{background:var(--ok-soft);color:var(--ok)}.kpi.infok .ico{background:var(--info-soft);color:var(--info)}
.kpi .v{font-size:23px;font-weight:700;line-height:1.1}.kpi .l{font-size:12px;color:var(--muted)}.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi:not(:has(.ico)){display:block}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--muted);white-space:nowrap;font-weight:500}
.badge.bad{background:var(--danger-soft);color:var(--danger)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.alerts{list-style:none;margin:0;padding:0}.alerts li{padding:9px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline}.alerts li:last-child{border:0}
.feed{list-style:none;margin:0;padding:0}.feed li{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)}.feed li:last-child{border:0}
.feed .av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:5px}.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0}.dl dt{color:var(--muted);font-size:12px;padding-top:1px}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* ---- tables ---- */
.tbl-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbl-bar input[type=search]{min-width:230px}.tbl-bar .spacer{flex:1}
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{position:sticky;top:0;background:var(--surface2);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;z-index:1}
th[data-sort]{cursor:pointer;user-select:none}th.sorted{color:var(--text)}th.sorted::after{content:" \25B2";font-size:9px}th.sorted.desc::after{content:" \25BC"}
tr[data-id]{cursor:pointer}tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:650;background:var(--surface2)}
.tbl-pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}.tbl-pager .spacer{flex:1}
.bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-radius:8px;margin-bottom:8px}
.lab-block table th{position:static}
/* ---- modal / forms ---- */
.modal-wrap{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:60}
.modal{background:var(--surface);border-radius:14px;width:min(580px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border)}.modal-h h2{margin:0}
.modal-b{padding:18px 20px;max-height:68vh;overflow:auto}.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--border);background:var(--surface2);border-radius:0 0 14px 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 16px}.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field.wide{grid-column:1/3}
.field label{font-size:12px;font-weight:600;color:var(--muted)}.field input,.field select,.field textarea{width:100%}
.help{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:400!important;color:var(--text)!important}
.multi{border:1px solid var(--border);border-radius:8px;padding:6px 10px;max-height:130px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.toolbar .field{min-width:140px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface);font-size:12px;cursor:pointer}.chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 15px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500;text-decoration:none}.tabs a:hover{color:var(--text)}.tabs a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.tabs .tc{font-size:11px;background:var(--surface2);padding:0 7px;border-radius:99px;margin-left:5px}
.chart svg{width:100%;height:auto;display:block}
#tip{position:fixed;pointer-events:none;background:#101826;color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;z-index:99;display:none;max-width:300px}
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#101826;color:#fff;padding:10px 15px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:380px}.toast.err{background:#b91c1c}
.lab-block{border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;background:var(--surface);break-inside:avoid}
.lab-block>.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--surface2)}.lab-block>.hd .spacer{flex:1}
.lab-block>.bd{padding:6px 14px 12px}
.pill{display:inline-block;padding:1px 8px;margin:1px 4px 1px 0;border-radius:6px;background:var(--surface2);font-size:12px}
.matrix td,.matrix th{padding:5px 8px;text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
.matrix th:first-child{background:var(--surface2)}.matrix .dim{opacity:.35}
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}.drop.over{border-color:var(--accent);background:var(--accent-soft)}
#connect{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}#connect .box{max-width:560px;width:100%}
.steps{counter-reset:s;padding-left:0;list-style:none}.steps li{counter-increment:s;margin:8px 0;padding-left:30px;position:relative}.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);text-align:center;font-size:12px;line-height:22px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--border)}.timeline li{position:relative;padding:0 0 16px 18px}.timeline li::before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.chg{font-size:12px;color:var(--muted)}.chg b{color:var(--text);font-weight:600}.chg s{color:var(--danger)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 26px;background:var(--accent-soft);border-bottom:1px solid var(--border)}.banner .spacer{flex:1}
/* collapsed + mobile */
body.nav-collapsed{--sw:68px}body.nav-collapsed .bt,body.nav-collapsed nav a span,body.nav-collapsed nav .sep,body.nav-collapsed .side-foot #sync-t,body.nav-collapsed nav a .cnt{display:none}
body.nav-collapsed nav a{justify-content:center;padding:10px}body.nav-collapsed .brand{justify-content:center;padding:16px 0}
#btn-menu{display:inline-flex}
@media(max-width:600px){#create .btn{font-size:0;padding:8px 10px}#create .btn .ic{font-size:18px}.top{gap:8px;padding:0 10px}}
@media(max-width:900px){#btn-user span:last-child,#btn-dl{display:none}.gs-res{position:fixed;left:10px;right:10px;top:62px}#side{transform:translateX(-100%)}body.nav-open #side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}.main-col{margin-left:0}.top{padding:0 14px}.split{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:1}main#view{padding:16px 14px}.g2{grid-template-columns:1fr}body.nav-collapsed{--sw:240px}}
@media print{#side,.top,.no-print,.btn,.tbl-bar,#toasts,.crumbs{display:none!important}.main-col{margin:0}body{background:#fff;color:#000}main#view{padding:0}.card,.lab-block,.kpi{box-shadow:none}.tbl-wrap{max-height:none;overflow:visible}}

/* ---- collapsible sidebar groups ---- */
.nav-tools{display:flex;gap:4px;justify-content:flex-end;padding:0 4px 2px}
.nav-tools button{background:none;border:0;color:var(--side-head);font-size:11px;cursor:pointer;padding:3px 6px;border-radius:5px}.nav-tools button:hover{color:#fff;background:var(--side2)}
nav .navg-h{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;cursor:pointer;text-align:left;font-family:inherit}
nav .navg-h:hover{color:#fff}nav .navg-h .ic{font-size:14px;transition:transform .2s}
.navg.shut .navg-h .ic{transform:rotate(-90deg)}
.navg-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease}.navg-body>div{overflow:hidden;min-height:0}
.navg.shut .navg-body{grid-template-rows:0fr}
body.nav-collapsed .nav-tools,body.nav-collapsed .navg-h{display:none}
body.nav-collapsed .navg.shut .navg-body{grid-template-rows:1fr}
body.nav-collapsed .navg+.navg{border-top:1px solid rgba(255,255,255,.07);margin-top:6px;padding-top:6px}
#side{transition:transform .2s,width .2s}.main-col{transition:margin-left .2s}
/* ---- rearrangeable dashboard sections ---- */
.dsec-tools{display:flex;align-items:center;gap:8px;margin:-4px 0 8px}.dsec-tools .spacer{flex:1}
.dsec{margin-bottom:6px;border-radius:12px}
.dsec-h{display:flex;align-items:center;gap:6px;margin:2px 0 8px}
.dsec-grip{cursor:grab;color:var(--muted);letter-spacing:-2px;padding:4px 6px;border-radius:6px;user-select:none;opacity:.55;font-weight:700}.dsec-grip:hover{opacity:1;background:var(--surface2)}.dsec-grip:active{cursor:grabbing}
.dsec-t{display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--text);font:inherit;font-weight:650;font-size:15px;padding:3px 6px;border-radius:7px}.dsec-t:hover{background:var(--surface2)}
.dsec-t .ic{font-size:16px;color:var(--muted);transition:transform .2s}.dsec.shut .dsec-t .ic{transform:rotate(-90deg)}
.dsec-n{margin-left:6px}
.dsec-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}.dsec-b>div{overflow:hidden;min-height:0;padding:2px 2px 0;margin:-2px}
.dsec.shut .dsec-b{grid-template-rows:0fr}.dsec.shut{margin-bottom:0}
.dsec.dragging{opacity:.4;outline:2px dashed var(--accent);outline-offset:4px}
/* ---- board drag and drop ---- */
.kcol{border-radius:10px;padding:4px;min-height:90px;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.kcol.over{background:var(--accent-soft);outline-color:var(--accent)}
.kcard{cursor:grab;transition:box-shadow .15s,transform .15s}.kcard:hover{box-shadow:0 4px 14px rgba(16,24,40,.12);transform:translateY(-1px)}.kcard.dragging{opacity:.35;transform:rotate(1.5deg)}
body.ro .kcard{cursor:default}

a.kpi{transition:transform .15s,border-color .15s,box-shadow .15s}a.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.12)}

// ---- 00-util.js
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 5);
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const UI = { tbl: {}, memo: {}, modal: null, needsRender: false, plan: null, chart: null };

// ---------- dates (stored as YYYY-MM-DD strings) ----------
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseD = s => {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], 12);
  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
};
const normDate = s => { s = String(s || '').trim(); if (/^(19|20)\d{2}$/.test(s)) return s + '-07-01'; const d = parseD(s); return d ? ymd(d) : ''; };    // a bare year is treated as mid-year
const addMonths = (s, m) => {
  const d = parseD(s); if (!d) return '';
  const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return ymd(d);
};
const addYears = (s, y) => addMonths(s, Math.round(y * 12));
const fmtDate = s => { const d = parseD(s); return d ? d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—'; };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const yearsBetween = (a, b) => (parseD(b) - parseD(a)) / (365.25 * 864e5);
const fyStart = () => DB.data.settings.fyStartMonth || 1;
const fiscalYear = s => {
  const d = parseD(s); if (!d) return 0;
  const st = fyStart(); return (st > 1 && d.getMonth() + 1 >= st) ? d.getFullYear() + 1 : d.getFullYear();
};
const fyRange = fy => {
  const st = fyStart();
  if (st === 1) return [`${fy}-01-01`, `${fy}-12-31`];
  return [`${fy - 1}-${pad(st)}-01`, ymd(new Date(fy, st - 1, 0, 12))];
};
const fiscalQuarter = s => { const d = parseD(s); return Math.floor(((d.getMonth() + 1 - fyStart() + 12) % 12) / 3) + 1; };

// ---------- number formatting ----------
const money = n => new Intl.NumberFormat(undefined, { style: 'currency', currency: DB.data?.settings?.currency || 'USD', maximumFractionDigits: 0 }).format(n || 0);
const fmtNum = n => new Intl.NumberFormat().format(Math.round((n || 0) * 10) / 10);
const compact = n => new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(n || 0);
const pct = n => Math.round((n || 0) * 10) / 10 + '%';

// ---------- CSV ----------
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0];
  const delim = [',', '\t', ';'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function csvToObjects(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { headers: [], rows: [] };
  const headers = rows[0].map(h => h.trim());
  return { headers, rows: rows.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? '').trim()]))) };
}
function toCSV(rows) {
  return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
}
function download(name, text, mime = 'text/csv') {
  const blob = new Blob([mime === 'text/csv' ? '﻿' + text : text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const readFileText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); });

// ---------- toast / modal ----------
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 8000 : 3200);
}
function closeModal() {
  if (!UI.modal) return;
  UI.modal.remove(); UI.modal = null;
  document.removeEventListener('keydown', modalKey);
  if (UI.needsRender) { UI.needsRender = false; render(); }
}
const modalKey = e => { if (e.key === 'Escape') closeModal(); };
function modal({ title, body, buttons = [], wide = false }) {
  if (UI.modal) { UI.modal.remove(); UI.modal = null; }
  const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
  wrap.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><div class="modal-h"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">×</button></div><div class="modal-b"></div><div class="modal-f"></div></div>`;
  const b = $('.modal-b', wrap);
  if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
  const f = $('.modal-f', wrap);
  buttons.forEach(bt => {
    const el = document.createElement('button'); el.className = 'btn ' + (bt.cls || ''); el.textContent = bt.label;
    el.onclick = async () => { const r = bt.onClick ? await bt.onClick(wrap) : true; if (r !== false) closeModal(); };
    f.appendChild(el);
  });
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(wrap); UI.modal = wrap;
  document.addEventListener('keydown', modalKey);
  const first = $('input:not([type=checkbox]),select,textarea', b); if (first) first.focus();
  return wrap;
}

// ---------- forms ----------
function optionsHTML(opts, sel) {
  return opts.map(o => {
    const v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o;
    return `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`;
  }).join('');
}
function fieldHTML(f, val) {
  const name = `name="${f.k}"`, req = f.req ? ' required' : '';
  let input;
  switch (f.type) {
    case 'textarea': input = `<textarea ${name} rows="${f.rows || 3}">${esc(val)}</textarea>`; break;
    case 'select': {
      const o = typeof f.options === 'function' ? f.options() : f.options;
      input = `<select ${name}${req}>${f.req ? '' : '<option value=""></option>'}${optionsHTML(o, val)}</select>`; break;
    }
    case 'check': input = `<label class="chk"><input type="checkbox" ${name}${val ? ' checked' : ''}> ${esc(f.hint || '')}</label>`; break;
    case 'multi': {
      const o = f.options(), set = new Set(val || []);
      input = `<div class="multi" data-multi="${f.k}">${o.length ? o.map(x => `<label class="chk"><input type="checkbox" value="${esc(x.v)}"${set.has(x.v) ? ' checked' : ''}> ${esc(x.l)}</label>`).join('') : '<span class="muted">None available yet</span>'}</div>`; break;
    }
    case 'number': input = `<input type="number" step="${f.step || 'any'}" ${name} value="${esc(val ?? '')}"${req}${f.min != null ? ` min="${f.min}"` : ''}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''}>`; break;
    default: input = `<input type="${f.type || 'text'}" ${name} value="${esc(val ?? '')}"${req}${f.list ? ` list="${f.list}"` : ''}${f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : ''}>`;
  }
  return `<div class="field${f.wide ? ' wide' : ''}"><label>${esc(f.label)}${f.req ? ' *' : ''}</label>${input}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
}
function readFields(root, fields) {
  const out = {};
  for (const f of fields) {
    if (f.type === 'multi') { out[f.k] = $$(`[data-multi="${f.k}"] input:checked`, root).map(i => i.value); continue; }
    const el = root.querySelector(`[name="${f.k}"]`); if (!el) continue;
    if (f.type === 'check') out[f.k] = el.checked;
    else if (f.type === 'number') out[f.k] = el.value === '' ? null : parseFloat(el.value);
    else out[f.k] = el.value.trim();
  }
  return out;
}

class FolderStore {
  constructor(dir, readOnly) { this.dir = dir; this.kind = 'folder'; this.name = dir.name; this.readOnly = readOnly; }

  }

  }

  async stat() { try { const f = await (await this.dir.getFileHandle(DATA_FILE)).getFile(); return f.lastModified + ':' + f.size; } catch { return null; } }
  async write(text) {
    const w = await (await this.dir.getFileHandle(DATA_FILE, { create: true })).createWritable();
    await w.write(text); await w.close();
  }
  async backupIfNeeded(text) {
    const day = todayStr();
    if (this._bk === day || !text) return;
    try {
      const bd = await this.dir.getDirectoryHandle('backups', { create: true });
      const name = `lab-tracker-${day}.json`;
      let exists = true; try { await bd.getFileHandle(name); } catch { exists = false; }
      if (!exists) {
        const w = await (await bd.getFileHandle(name, { create: true })).createWritable();
        await w.write(text); await w.close();
        const names = []; for await (const [n] of bd.entries()) if (/^lab-tracker-\d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);

    } catch (e) { console.warn('backup failed', e); }
  }
  async acquire() {
    const me = uid(), deadline = Date.now() + 12000;
    const readLock = async () => { try { return JSON.parse(await (await (await this.dir.getFileHandle(LOCK_FILE)).getFile()).text()); } catch { return null; } };
    while (true) {
      const cur = await readLock();
      if (!cur || Date.now() - cur.t > 15000) {
        const w = await (await this.dir.getFileHandle(LOCK_FILE, { create: true })).createWritable();
        await w.write(JSON.stringify({ id: me, u: DB.user, t: Date.now() })); await w.close();
        await sleep(150 + Math.random() * 150);

  }
  async release() {
    if (!this._lock) return;
    try { const c = JSON.parse(await (await (await this.dir.getFileHandle(LOCK_FILE)).getFile()).text()); if (c.id === this._lock) await this.dir.removeEntry(LOCK_FILE); } catch { }

// ---------- integrity ----------
const totalRecords = d => TABLES.reduce((a, t) => a + (Array.isArray(d[t]) ? d[t].length : 0), 0);

const integrityErr = msg => Object.assign(new Error(msg), { integrity: true });
// A file is "damaged" if it is not an object, a table is not a list, or the record counts it recorded no longer match its content.
function validateData(d) {
  const p = [];
  if (!d || typeof d !== 'object' || Array.isArray(d)) return ['not a tracker data file'];
  TABLES.forEach(t => { if (d[t] !== undefined && !Array.isArray(d[t])) p.push(`table “${t}” is not a list`); });
  if (d.counts && typeof d.counts === 'object') TABLES.forEach(t => { if (d.counts[t] != null && (d[t] || []).length !== d.counts[t]) p.push(`${t}: file says ${d.counts[t]} records but contains ${(d[t] || []).length}`); });

}
async function readChecked(store) {
  let r;
  try { r = await store.read(); } catch (e) { if (e instanceof SyntaxError) throw Object.assign(new Error('the data file is not valid JSON (it may be truncated)'), { damaged: true }); throw e; }
  if (r) { const probs = validateData(r.data); if (probs.length) throw Object.assign(new Error(probs.join('; ')), { damaged: true }); }
  return r;
}

function updateStatus() {

  const s = DB.store; let cls = '', txt = '';

  else if (DB.halted) { cls = 'err'; txt = 'Saving paused – integrity check'; }
  else if (DB.status === 'err') { cls = 'err'; txt = 'Save failed – retrying'; }
  else if (DB.saving) { cls = 'busy'; txt = 'Saving…'; }
  else if (DB.dirty()) { cls = 'busy'; txt = 'Unsaved changes…'; }
  else {
    const when = DB.lastSaved ? new Date(DB.lastSaved).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
    if (s.kind === 'demo') { cls = 'demo'; txt = 'Demo data (stored in this browser)'; }
    else if (s.kind === 'file') { cls = 'demo'; txt = s.unsaved ? 'File mode – download to keep changes' : 'File mode'; }
    else txt = `Shared folder “${s.name}”${when ? ` · saved ${when}${DB.lastBy ? ' by ' + DB.lastBy : ''}` : ''}${DB.readOnly ? ' · view only' : ''}`;
  }
  el.className = cls; $('#sync-t').textContent = txt;
  $('#btn-dl').hidden = !(s && s.kind === 'file');
  document.body.classList.toggle('ro', !!(DB.readOnly || DB.confirmOnly));
}

// ---------- replacement plan ----------
function replacementPlan({ from, to, overdue = true, platform = '', buildingId = '' }) {
  const t = todayStr(), groups = new Map();
  for (const l of DB.data.hardware) {
    if (!isActiveLine(l)) continue;
    const p = plannedDate(l); if (!p) continue;
    const inRange = p >= from && p <= to;
    if (!inRange && !(overdue && p < from)) continue;
    if (platform && platformOf(l) !== platform) continue;
    const lab = DB.get('labs', l.labId); if (!lab) continue;
    if (buildingId && lab.buildingId !== buildingId) continue;
    const g = groups.get(lab.id) || { lab, lines: [], qty: 0, cost: 0, first: p };
    const flag = p < t ? 'Overdue' : (p < from ? 'Carry-over' : 'Scheduled');
    g.lines.push({ line: l, planned: p, cost: lineCost(l), flag });
    g.qty += +l.qty || 0; g.cost += lineCost(l); if (p < g.first) g.first = p;
    groups.set(lab.id, g);
  }
  const labs = [...groups.values()].sort((a, b) => cmp(a.first, b.first) || cmp(labLabel(a.lab), labLabel(b.lab)));
  labs.forEach(g => g.lines.sort((a, b) => cmp(a.planned, b.planned)));
  return { labs, qty: sum(labs, g => g.qty), cost: sum(labs, g => g.cost), lines: labs.flatMap(g => g.lines.map(x => ({ ...x, lab: g.lab }))) };
}

// ---------- device -> lab matching ----------
// Order: (1) lab match keywords, (2) your naming patterns, (3) building + room tokens anywhere in name/location/tags,
// (4) a generic "BLDG-ROOM-xx" guess at the start of the name. Building names, codes and aliases all count.
const normKey = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const normRoom = s => normKey(s).replace(/^0+(?=[0-9])/, '');

    const src = String(p).trim().split(/(\{\w+\})/).map(t => { const m = /^\{(\w+)\}$/.exec(t); return m && map[m[1]] ? map[m[1]] : t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('');
    return src ? new RegExp('^' + src, 'i') : null;
  } catch { return null; }
}
const namePrefix = n => String(n || '').replace(/[-_ .]?(pc|mac|imac|win|lt|wks|ws|mini|desktop|laptop|dt)?[-_ .]?\d+$/i, '').trim();

  const bKeys = new Map(), bById = new Map();
  DB.data.buildings.forEach(b => {
    const keys = [b.code, b.name, ...(b.aliases || '').split(/[,;]/)].map(normKey).filter(Boolean);
    bById.set(b.id, { b, keys }); keys.forEach(k => { if (!bKeys.has(k)) bKeys.set(k, b.id); });
  });
  const labByBR = new Map();
  const labs = DB.data.labs.map(lab => {
    const bi = bById.get(lab.buildingId), roomN = normRoom(lab.room);
    if (bi && roomN) labByBR.set(lab.buildingId + '|' + roomN, lab);
    return { lab, roomN, roomRaw: normKey(lab.room), keys: bi ? bi.keys : [], bName: (bi?.b.name || '').toLowerCase(), kws: (lab.match || '').split(/[,\n;]/).map(s => s.trim().toLowerCase()).filter(Boolean) };
  });

    const fields = [d.name, d.location, d.tags, d.group].filter(Boolean);

    for (const m of labs) for (const k of m.kws) if (hay.includes(k) && k.length > bestLen) { best = m.lab; bestLen = k.length; }
    if (best) return { lab: best, how: 'keyword' };
    for (const re of pats) for (const s of fields) { const g = re.exec(s)?.groups; if (g?.bldg && g?.room) { const lab = tryBR(g.bldg, g.room); if (lab) return { lab, how: 'pattern' }; } }

      }
      if ((tokens.has(m.roomRaw) || tokens.has(m.roomN)) && m.bName && hay.includes(m.bName)) return { lab: m.lab, how: 'building + room' };
    }
    for (const s of [d.name, d.location]) { const g = guess.exec(s || ''); if (g) { const lab = tryBR(g[1], g[2]); if (lab) return { lab, how: 'name guess' }; } }
    return { lab: null, how: '' };

// ---- 03-charts.js
// Dependency-free SVG charts (work offline on a network share) + the chart-builder data layer.
const CHART_COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)', 'var(--c8)'];
const seriesColor = (name, i) => name === 'Windows' ? CHART_COLORS[0] : name === 'Mac' ? CHART_COLORS[1] : (name === 'Other' || name === 'Other (grouped)') ? CHART_COLORS[7] : CHART_COLORS[i % CHART_COLORS.length];

function niceScale(max, n = 5) {
  if (!(max > 0)) return { max: 1, ticks: [0, .25, .5, .75, 1] };
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const ticks = []; for (let v = 0; v < max + step * 0.999; v += step) ticks.push(+v.toFixed(10));
  return { max: ticks[ticks.length - 1], ticks };
}
const fmtVal = (v, money) => money ? '$' + compact(v) : compact(v);
const fmtFull = (v, money) => money ? money_(v) : fmtNum(v);
const money_ = v => money(v);

function legendSVG(names, W, x0, y0) {

  names.forEach((n, i) => {
    const w = 22 + String(n).length * 6.6 + 14;
    if (x + w > W - 10 && x > x0) { x = x0; y += 18; }
    out += `<rect x="${x}" y="${y - 9}" width="10" height="10" rx="2" fill="${seriesColor(n, i)}"/><text x="${x + 15}" y="${y}" font-size="12" fill="var(--text)">${esc(trunc(n, 28))}</text>`;
    x += w;

  return { svg: out, h: y - y0 + 18 };
}
const tipAttr = t => ` class="mark" data-tip="${esc(t)}"`;

function barSVG(spec, horiz) {
  const { labels, series, money } = spec, n = labels.length, multi = series.length > 1;
  const stacked = multi && spec.stacked !== false;
  const totals = labels.map((_, i) => stacked ? sum(series, s => s.values[i] || 0) : Math.max(...series.map(s => s.values[i] || 0)));
  const sc = niceScale(Math.max(...totals));
  const W = spec.w || 760; let out = '';
  const leg = multi ? legendSVG(series.map(s => s.name), W, 12, 16) : { svg: '', h: 0 };
  const tip = (i, s) => `${labels[i]}${multi ? ' · ' + s.name : ''}: ${fmtFull(s.values[i], money)}`;
  if (!horiz) {
    const rot = n > 7, m = { l: 56, r: 12, t: 12 + leg.h, b: rot ? 86 : 40 }, H = 340 + leg.h;
    const iw = W - m.l - m.r, ih = H - m.t - m.b, band = iw / n, bw = Math.min(56, band * 0.72);
    out += leg.svg;

      const cx = m.l + band * i + band / 2, x0 = cx - bw / 2;

        });
        if (n <= 14 && totals[i]) out += `<text x="${cx}" y="${m.t + ih - totals[i] / sc.max * ih - 5}" text-anchor="middle" font-size="11" fill="var(--text)">${fmtVal(totals[i], money)}</text>`;
      } else {
        const gw = bw / series.length;
        series.forEach((s, si) => {
          const v = s.values[i] || 0, h = v / sc.max * ih, x = x0 + gw * si;
          out += `<rect${tipAttr(tip(i, s))} x="${x}" y="${m.t + ih - h}" width="${Math.max(1, gw - 2)}" height="${h}" rx="3" fill="${seriesColor(s.name, si)}"/>`;
          if (n <= 14 && !multi && v) out += `<text x="${x + gw / 2}" y="${m.t + ih - h - 5}" text-anchor="middle" font-size="11" fill="var(--text)">${fmtVal(v, money)}</text>`;
        });
      }
      const ty = m.t + ih + 16;
      out += rot ? `<text transform="translate(${cx + 4},${ty - 2}) rotate(-38)" text-anchor="end" font-size="11" fill="var(--muted)">${esc(trunc(lb, 22))}</text>` : `<text x="${cx}" y="${ty}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(trunc(lb, 16))}</text>`;
    });
    out += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--muted)"/>`;
    return `<svg class="bv" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title || 'Bar chart')}">${out}</svg>`;
  }
  const rowH = 28, m = { l: W < 600 ? 112 : 180, r: 56, t: 10 + leg.h, b: 28 }, H = m.t + m.b + n * rowH, iw = W - m.l - m.r;
  out += leg.svg;
  sc.ticks.forEach(t => { const x = m.l + t / sc.max * iw; out += `<line y1="${m.t}" y2="${H - m.b}" x1="${x}" x2="${x}" stroke="var(--border)"/><text x="${x}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtVal(t, money)}</text>`; });
  labels.forEach((lb, i) => {
    const y = m.t + i * rowH, bh = rowH - 8;
    out += `<text x="${m.l - 8}" y="${y + rowH / 2 + 1}" text-anchor="end" font-size="11" fill="var(--text)">${esc(trunc(lb, W < 600 ? 16 : 24))}</text>`;
    let acc = 0;
    series.forEach((s, si) => {
      const v = s.values[i] || 0; if (!v) return;
      const w = v / sc.max * iw, x = stacked ? m.l + acc / sc.max * iw : m.l;
      if (stacked) acc += v;

  });
  return `<svg class="bh" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title || 'Bar chart')}">${out}</svg>`;
}

function lineSVG(spec) {
  const { labels, series, money } = spec, n = labels.length, multi = series.length > 1;
  const sc = niceScale(Math.max(...series.flatMap(s => s.values), 0));
  const W = 760, leg = multi ? legendSVG(series.map(s => s.name), W, 12, 16) : { svg: '', h: 0 };
  const rot = n > 8, m = { l: 56, r: 20, t: 14 + leg.h, b: rot ? 86 : 40 }, H = 340 + leg.h;
  const iw = W - m.l - m.r, ih = H - m.t - m.b, X = i => m.l + (n === 1 ? iw / 2 : iw * i / (n - 1)), Y = v => m.t + ih - v / sc.max * ih;
  let out = leg.svg;
  sc.ticks.forEach(t => { const y = Y(t); out += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${m.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtVal(t, money)}</text>`; });
  labels.forEach((lb, i) => {
    const x = X(i), ty = m.t + ih + 16;
    out += rot ? `<text transform="translate(${x + 4},${ty - 2}) rotate(-38)" text-anchor="end" font-size="11" fill="var(--muted)">${esc(trunc(lb, 22))}</text>` : `<text x="${x}" y="${ty}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(trunc(lb, 16))}</text>`;
  });
  series.forEach((s, si) => {
    const c = seriesColor(s.name, si);
    out += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${s.values.map((v, i) => `${X(i)},${Y(v || 0)}`).join(' ')}"/>`;
    s.values.forEach((v, i) => {
      out += `<circle${tipAttr(`${labels[i]}${multi ? ' · ' + s.name : ''}: ${fmtFull(v || 0, money)}`)} cx="${X(i)}" cy="${Y(v || 0)}" r="4.5" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`;
      if (!multi && n <= 14) out += `<text x="${X(i)}" y="${Y(v || 0) - 10}" text-anchor="middle" font-size="11" fill="var(--text)">${fmtVal(v || 0, money)}</text>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title || 'Line chart')}">${out}</svg>`;

function donutSVG(spec) {
  const { labels, money } = spec, vals = spec.series[0].values, total = sum(vals), cp = !!spec.compact, W = cp ? 300 : 760, H = cp ? 250 + labels.length * 20 : Math.max(300, 40 + labels.length * 24);
  const cx = cp ? 150 : 170, cy = cp ? 112 : H / 2, r1 = cp ? 96 : 130, r0 = cp ? 58 : 76;
  let a = -Math.PI / 2, out = '';
  const P = (r, t) => [cx + r * Math.cos(t), cy + r * Math.sin(t)];
  labels.forEach((lb, i) => {
    if (!vals[i]) return;
    const da = Math.min(vals[i] / total * Math.PI * 2, Math.PI * 2 - 0.0002), a1 = a + da, large = da > Math.PI ? 1 : 0;
    const [x0, y0] = P(r1, a), [x1, y1] = P(r1, a1), [x2, y2] = P(r0, a1), [x3, y3] = P(r0, a);
    out += `<path${tipAttr(`${lb}: ${fmtFull(vals[i], money)} (${(vals[i] / total * 100).toFixed(1)}%)`)} d="M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z" fill="${seriesColor(lb, i)}" stroke="var(--surface)" stroke-width="2"/>`;
    a += da;
  });

  });

function renderChart(host, spec) {

  const svg = spec.type === 'donut' ? donutSVG(spec) : spec.type === 'line' ? lineSVG(spec) : barSVG(spec, spec.type === 'hbar');

function mountCharts(root) {

  const svgEl = $('svg', host); if (!svgEl) return;

function computeChart(cfg) {
  const ds = DS[cfg.dataset], g = ds.groups[cfg.group] || Object.values(ds.groups)[0], m = ds.metrics[cfg.metric] || Object.values(ds.metrics)[0];
  const sp = cfg.split && cfg.split !== cfg.group && cfg.type !== 'donut' ? ds.groups[cfg.split] : null;
  const f = cfg.filters || {};
  let rows = ds.rows();
  if (f.platform) rows = rows.filter(r => [].concat(ds.plat(r)).includes(f.platform));
  if (f.buildingId && ds.bld) rows = rows.filter(r => ds.bld(r) === f.buildingId);
  const cells = new Map(), seriesTot = new Map(), labelTot = new Map();
  rows.forEach(r => {
    const k = String(g.f(r)), s = sp ? String(sp.f(r)) : m.label, v = m.f(r);
    if (!cells.has(k)) cells.set(k, new Map());
    cells.get(k).set(s, (cells.get(k).get(s) || 0) + v);
    seriesTot.set(s, (seriesTot.get(s) || 0) + v); labelTot.set(k, (labelTot.get(k) || 0) + v);
  });
  const lastish = ['No date', 'Unknown', 'Unassigned', 'No data', 'Never / unknown'];
  let labels = [...cells.keys()];
  if (g.order) labels.sort((a, b) => { const ia = g.order.indexOf(a), ib = g.order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  else if (g.time) labels.sort((a, b) => (lastish.includes(a) - lastish.includes(b)) || cmp(a, b));
  else labels.sort((a, b) => labelTot.get(b) - labelTot.get(a) || cmp(a, b));
  const topN = cfg.topN || 12;
  let other = null;
  if (!g.order && !g.time && labels.length > topN) { other = labels.slice(topN - 1); labels = labels.slice(0, topN - 1); labels.push('Other (grouped)'); }
  let snames = [...seriesTot.keys()].sort((a, b) => seriesTot.get(b) - seriesTot.get(a) || cmp(a, b));
  if (sp && sp.order) snames.sort((a, b) => sp.order.indexOf(a) - sp.order.indexOf(b));
  let sOther = null;
  if (snames.length > 8) { sOther = snames.slice(7); snames = snames.slice(0, 7); snames.push('Other (grouped)'); }
  const val = (lb, sn) => {
    const ls = lb === 'Other (grouped)' && other ? other : [lb], ss = sn === 'Other (grouped)' && sOther ? sOther : [sn];
    return sum(ls, l => sum(ss, s => cells.get(l)?.get(s) || 0));
  };
  return { labels, series: snames.map(sn => ({ name: sn, values: labels.map(lb => val(lb, sn)) })), money: !!m.money, metricLabel: m.label, groupLabel: g.label, rowsN: rows.length };
}

// Generic table, entity dialogs, router.
function mountTable(host, cfg) {
  const st = (UI.tbl[cfg.id] ??= { q: '', sort: cfg.defaultSort || null, page: 0, f: {}, sel: new Set(), size: cfg.pageSize || 50 });
  let hidden;
  try { const sv = JSON.parse(localStorage.getItem('lt-cols-' + cfg.id) || 'null'); hidden = new Set(sv || cfg.cols.filter(c => c.hidden).map(c => c.k)); } catch { hidden = new Set(); }
  const search = cfg.searchText || (r => cfg.cols.map(c => c.val ? c.val(r) : '').join(' '));
  host.innerHTML = `<div class="tbl-bar"><input type="search" placeholder="Search…" value="${esc(st.q)}" data-q>
    ${(cfg.filters || []).map(f => `<select data-f="${f.k}" title="${esc(f.label)}"><option value="">${esc(f.label)}: all</option>${optionsHTML(f.options(), st.f[f.k])}</select>`).join('')}
    <span class="spacer"></span><span class="muted small" data-count></span>
    <div class="dd"><button class="btn sm" data-dd>${ic('sliders')} Views</button><div class="dd-menu" data-views></div></div>
    <div class="dd"><button class="btn sm" data-dd>${ic('columns')} Columns</button><div class="dd-menu">${cfg.cols.filter(c => c.label).map(c => `<label><input type="checkbox" data-col="${c.k}"${hidden.has(c.k) ? '' : ' checked'}> ${esc(c.label)}</label>`).join('')}</div></div>
    <button class="btn sm" data-csv>${ic('download')} Export</button></div>
    <div data-bulk></div><div class="tbl-wrap"></div><div class="tbl-pager"></div>`;
  const wrap = $('.tbl-wrap', host), pager = $('.tbl-pager', host);
  const VK = 'lt-views-' + cfg.id, loadViews = () => { try { return JSON.parse(localStorage.getItem(VK) || '[]'); } catch { return []; } };
  const drawViews = () => { const v = loadViews(); $('[data-views]', host).innerHTML = `<div class="dh">Saved views (this computer)</div>${v.map((x, i) => `<div style="display:flex"><button data-vapply="${i}">${esc(x.name)}</button><button data-vdel="${i}" style="width:auto" title="Delete">×</button></div>`).join('') || '<div class="small muted" style="padding:4px 10px">None yet</div>'}<button data-vsave>${ic('plus')} Save current view…</button>`; };
  drawViews();
  const filtered = () => {
    let rows = cfg.rows();
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => search(r).toLowerCase().includes(q)); }
    for (const f of cfg.filters || []) if (st.f[f.k]) rows = rows.filter(r => f.test(r, st.f[f.k]));
    if (st.sort) { const c = cfg.cols.find(c => c.k === st.sort.k); if (c) rows = [...rows].sort((a, b) => cmp(c.val(a), c.val(b)) * (st.sort.dir === 'desc' ? -1 : 1)); }
    return rows;
  };
  const draw = () => {
    const cols = cfg.cols.filter(c => !hidden.has(c.k));
    const rows = filtered(), size = st.size, pages = Math.max(1, Math.ceil(rows.length / size)); st.page = Math.min(st.page, pages - 1);
    const view = rows.slice(st.page * size, (st.page + 1) * size);
    $('[data-count]', host).textContent = `${fmtNum(rows.length)} row${rows.length === 1 ? '' : 's'}`;
    const bulk = $('[data-bulk]', host);
    if (cfg.bulk && st.sel.size) { bulk.innerHTML = `<div class="bulk edit-only"><b>${st.sel.size} selected</b>${cfg.bulk.map((b, i) => `<button class="btn sm" data-bulkfn="${i}">${esc(b.label)}</button>`).join('')}<button class="btn sm ghost" data-clear>Clear</button></div>`; } else bulk.innerHTML = '';
    if (!rows.length) { wrap.innerHTML = `<div class="empty">${esc(cfg.empty || 'Nothing to show.')}</div>`; pager.innerHTML = ''; return; }
    const allSel = view.length && view.every(r => st.sel.has(cfg.rowId(r)));
    wrap.innerHTML = `<table><thead><tr>${cfg.selectable ? `<th><input type="checkbox" data-selall${allSel ? ' checked' : ''}></th>` : ''}${cols.map(c => `<th class="${c.num ? 'num' : ''}${st.sort?.k === c.k ? ' sorted' + (st.sort.dir === 'desc' ? ' desc' : '') : ''}" ${c.val ? `data-sort="${c.k}"` : ''}>${esc(c.label)}</th>`).join('')}</tr></thead>
      <tbody>${view.map(r => { const id = cfg.rowId(r); return `<tr data-id="${esc(id)}">${cfg.selectable ? `<td><input type="checkbox" data-sel="${esc(id)}"${st.sel.has(id) ? ' checked' : ''}></td>` : ''}${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.html ? c.html(r) : esc(c.val(r) ?? '')}</td>`).join('')}</tr>`; }).join('')}</tbody>
      ${cfg.foot ? `<tfoot><tr>${cfg.selectable ? '<td></td>' : ''}${cols.map(c => `<td class="${c.num ? 'num' : ''}">${cfg.foot(c, rows) ?? ''}</td>`).join('')}</tr></tfoot>` : ''}</table>`;
    const from = st.page * size + 1;
    pager.innerHTML = `<span>Showing ${fmtNum(from)}–${fmtNum(Math.min(rows.length, from + size - 1))} of ${fmtNum(rows.length)}</span><span class="spacer"></span><label>Rows <select data-size>${[25, 50, 100, 250].map(n => `<option${n === size ? ' selected' : ''}>${n}</option>`).join('')}</select></label>${pages > 1 ? `<button class="btn sm" data-pg="-1"${st.page === 0 ? ' disabled' : ''}>Prev</button> Page ${st.page + 1} / ${pages} <button class="btn sm" data-pg="1"${st.page >= pages - 1 ? ' disabled' : ''}>Next</button>` : ''}`;
  };
  host.addEventListener('input', e => { if (e.target.matches('[data-q]')) { st.q = e.target.value; st.page = 0; draw(); } });
  host.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-f]')) { st.f[t.dataset.f] = t.value; st.page = 0; draw(); }
    else if (t.matches('[data-size]')) { st.size = +t.value; st.page = 0; draw(); }
    else if (t.matches('[data-col]')) { t.checked ? hidden.delete(t.dataset.col) : hidden.add(t.dataset.col); try { localStorage.setItem('lt-cols-' + cfg.id, JSON.stringify([...hidden])); } catch { } draw(); }
    else if (t.matches('[data-sel]')) { t.checked ? st.sel.add(t.dataset.sel) : st.sel.delete(t.dataset.sel); draw(); }
    else if (t.matches('[data-selall]')) { filtered().slice(st.page * st.size, (st.page + 1) * st.size).forEach(r => t.checked ? st.sel.add(cfg.rowId(r)) : st.sel.delete(cfg.rowId(r))); draw(); }
  });
  host.addEventListener('click', e => {
    const t = e.target;
    const vs = t.closest('[data-vsave]'), va = t.closest('[data-vapply]'), vd = t.closest('[data-vdel]');
    if (vs) { const name = prompt('Name this view'); if (name) { const v = loadViews(); v.push({ name, q: st.q, f: { ...st.f }, sort: st.sort }); try { localStorage.setItem(VK, JSON.stringify(v)); } catch { } drawViews(); toast('View saved'); } return; }
    if (va) { const x = loadViews()[+va.dataset.vapply]; st.q = x.q; st.f = { ...x.f }; st.sort = x.sort; st.page = 0; $('[data-q]', host).value = st.q; $$('[data-f]', host).forEach(s => s.value = st.f[s.dataset.f] || ''); draw(); $$('.dd.open').forEach(d => d.classList.remove('open')); return; }
    if (vd) { const v = loadViews(); v.splice(+vd.dataset.vdel, 1); try { localStorage.setItem(VK, JSON.stringify(v)); } catch { } drawViews(); return; }
    if (t.closest('.dd-menu')) return;
    if (t.closest('[data-sort]')) { const k = t.closest('[data-sort]').dataset.sort; st.sort = st.sort?.k === k ? (st.sort.dir === 'asc' ? { k, dir: 'desc' } : null) : { k, dir: 'asc' }; draw(); return; }
    if (t.closest('[data-pg]')) { st.page += +t.closest('[data-pg]').dataset.pg; draw(); return; }
    if (t.closest('[data-csv]')) { download((cfg.csvName || cfg.id) + '.csv', toCSV([cfg.cols.filter(c => c.label).map(c => c.label), ...filtered().map(r => cfg.cols.filter(c => c.label).map(c => c.csv ? c.csv(r) : c.val ? c.val(r) : ''))])); return; }
    if (t.closest('[data-clear]')) { st.sel.clear(); draw(); return; }
    const bb = t.closest('[data-bulkfn]'); if (bb) { cfg.bulk[+bb.dataset.bulkfn].fn([...st.sel], () => { st.sel.clear(); }); return; }
    if (t.closest('input,button,a,select,label')) return;
    const tr = t.closest('tr[data-id]'); if (tr && cfg.onRow) cfg.onRow(tr.dataset.id);
  });
  draw();
}

function editEntity(kind, id, defaults = {}, after) {
  const sc = SCHEMA[kind], rec = id ? DB.get(sc.table, id) : null;
  const vals = rec ? (sc.prep ? sc.prep(rec) : clone(rec)) : { ...(sc.defaults ? sc.defaults() : {}), ...defaults, ...(sc.prep ? sc.prep(null) : {}) };
  const form = document.createElement('form'); form.className = 'form-grid';
  form.innerHTML = sc.fields.map(f => fieldHTML(f, vals[f.k])).join('') + (sc.extra ? sc.extra(vals) : '') + (rec && (rec._b || rec._c) ? `<div class="field wide small muted">${rec._c ? 'Created by ' + esc(rec._c) + (rec._cu ? ' on ' + esc(fmtDate(rec._cu.slice(0, 10))) : '') + ' · ' : ''}Last edited by ${esc(rec._b || '—')}${rec._u ? ' on ' + esc(fmtDate(rec._u.slice(0, 10))) : ''}</div>` : '');
  form.addEventListener('submit', e => e.preventDefault());
  sc.onOpen?.(form, vals);
  const done = after || (() => render());
  modal({
    title: (rec ? 'Edit ' : 'Add ') + sc.title, body: form, wide: sc.wide,
    buttons: [
      ...(rec && !sc.noDelete ? [{
        label: 'Delete', cls: 'danger left', onClick: () => {
          if (!confirm(`Delete this ${sc.title.toLowerCase()}? This cannot be undone.`)) return false;
          if (sc.remove) { if (sc.remove(rec) === false) return false; } else DB.remove(sc.table, rec.id);
          DB.log(`Deleted ${sc.title.toLowerCase()} ${rec.name || ''}`.trim()); toast('Deleted'); done();
        }
      }] : []),
      { label: 'Cancel' },
      {
        label: 'Save', cls: 'primary', onClick: () => {
          if (!form.reportValidity()) return false;
          const out = readFields(form, sc.fields);
          if (sc.save) { if (sc.save(rec, out) === false) return false; }
          else { DB.put(sc.table, { ...(rec || defaults), ...out }); DB.log(`${rec ? 'Edited' : 'Added'} ${sc.title.toLowerCase()} ${out.name || ''}`.trim()); }
          toast('Saved'); done();
        }
      }]
  });
}

// ---------------- Replacement plan ----------------
function planPeriod(preset) {
  const t = todayStr(), fy = fiscalYear(t);
  return {
    warn: [t, addMonths(t, S().warnMonths)], fy0: fyRange(fy), fy1: fyRange(fy + 1), fy01: [fyRange(fy)[0], fyRange(fy + 1)[1]],
    cal: [`${t.slice(0, 4)}-01-01`, `${t.slice(0, 4)}-12-31`], q: [t, addMonths(t, 3)], y2: [t, addMonths(t, 24)]
  }[preset];
}
function planRows(plan) {

function addSoftwareToLab(lab) {
  const have = new Set(softwareForLab(lab.id).map(x => x.sw.id)), plats = labPlatforms(lab);
  const opts = DB.data.software.filter(s => !have.has(s.id)).sort((a, b) => cmp(a.name, b.name));

  modal({

function copySoftware(lab) {
  const others = DB.data.labs.filter(l => l.id !== lab.id && (swByLab().get(l.id) || []).length);
  if (!others.length) return toast('No other lab has software recorded yet.');
  const body = document.createElement('div');
  body.innerHTML = `<div class="field"><label>Copy software list from</label><select>${optionsHTML(others.map(l => ({ v: l.id, l: labLabel(l) })))}</select></div>`;
  modal({

      label: 'Copy', cls: 'primary', onClick: () => {
        const have = new Set(softwareForLab(lab.id).map(x => x.sw.id)); let n = 0;
        softwareForLab($('select', body).value).forEach(({ sw }) => { if (!have.has(sw.id)) { DB.put('labSoftware', { labId: lab.id, softwareId: sw.id }); n++; } });
        DB.log(`Copied ${n} software titles into ${labLabel(lab)}`); toast(`Added ${n} title(s)`); render();
      }

function syncInventory(lab) {
  const st = labStats(lab); if (!st.devs.length) return toast('No managed devices are linked to this lab.');
  const byModel = group(st.devs.filter(d => d.model), d => d.model.toLowerCase()), plan = [];
  for (const [k, ds] of byModel) {
    const ln = st.lines.find(l => modelName(l).toLowerCase() === k), osCount = {};
    ds.forEach(d => osCount[d.os] = (osCount[d.os] || 0) + 1);
    plan.push({ k, ds, ln, os: Object.entries(osCount).sort((a, b) => b[1] - a[1])[0]?.[0] });
  }
  const msg = plan.map(p => `• ${p.ds[0].model}: ${p.ln ? `${p.ln.qty} → ${p.ds.length}` : `new line × ${p.ds.length}`}`).join('\n');
  if (!confirm(`Update inventory for ${labLabel(lab)} from managed devices?\n\n${msg}\n\nLines not seen in managed devices are left alone.`)) return;
  plan.forEach(p => {
    if (p.ln) DB.put('hardware', { ...p.ln, qty: p.ds.length, os: p.os || p.ln.os });
    else { const m = findOrCreateModel(p.ds[0].model, p.ds[0].platform, p.ds[0].manufacturer); DB.put('hardware', { labId: lab.id, modelId: m.id, platform: m.platform, qty: p.ds.length, unitCost: null, os: p.os, status: 'In service', notes: 'Created from managed devices – add purchase / last-replaced date' }); }
  });
  DB.log(`Synced inventory for ${labLabel(lab)} from managed devices`); toast('Inventory updated'); render();
}

// ---- devices ----
function parseGB(s) {
  const n = num(s); if (!n) return 0;
  if (/tb/i.test(s)) return Math.round(n * 1000); if (/mb/i.test(s)) return Math.round(n / 1024);
  if (n > 1e7) return Math.round(n / 1e9);       // bytes
  return Math.round(n);
}
function parseDevices(I) {
  const { parsed, map, source } = I;
  return parsed.rows.map(r => {
    const g = k => map[k] ? (r[map[k]] || '').trim() : '', osRaw = g('os'), ver = g('osVersion'), model = g('model');
    const platform = platformFrom(osRaw, ver, source, model);
    return {
      name: g('name'), serial: g('serial'), model, manufacturer: g('manufacturer'), platform, os: friendlyOS(osRaw || (platform === 'Windows' ? 'Windows' : platform === 'Mac' ? 'macOS' : ''), ver),
      osVersion: ver, ramGB: parseGB(g('ram')), storageGB: parseGB(g('storage')), lastCheckIn: normDate(g('lastCheckIn')), user: g('user'), location: g('location'), tags: g('tags'), source, mobile: /ios|ipados|android|tvos|iphone|ipad/i.test(osRaw + ' ' + model)
    };
  }).filter(d => d.name || d.serial);
}
function buildDevicePreview(I) {
  const rows = parseDevices(I).filter(d => !(I.opts.skipMobile && d.mobile));
  const matcher = buildLabMatcher(), src = I.source;
  const bySerial = new Map(), byName = new Map(), byNameSrc = new Map();
  DB.data.devices.forEach(d => { if (d.serial) bySerial.set(d.serial.toUpperCase(), d); if (d.name) { byName.set(d.name.toLowerCase(), d); byNameSrc.set((d.source || '') + '|' + d.name.toLowerCase(), d); } });
  const items = rows.map(d => {
    const nm = (d.name || '').toLowerCase();
    const ex = (d.serial && bySerial.get(d.serial.toUpperCase())) || (src === 'LabStats' ? byName.get(nm) : byNameSrc.get(src + '|' + nm)) || null;
    const { lab, how } = matcher.full(d);
    const labId = ex && ex.labLocked && I.opts.keep ? ex.labId : (lab?.id || ex?.labId || '');
    let action = 'new';
    if (ex) action = ['name', 'model', 'os', 'osVersion', 'lastCheckIn', 'user'].some(k => d[k] && d[k] !== ex[k]) || labId !== (ex.labId || '') ? 'update' : 'same';
    return { d, ex, labId, action, how: lab && labId === lab.id ? how : '' };
  });
  return items;
}
function unmatchedPanel(items, I) {
  const groups = new Map();
  items.filter(i => !i.labId).forEach(i => {
    const key = (I.source === 'LabStats' && i.d.tags) ? i.d.tags : namePrefix(i.d.name) || i.d.name;
    const g = groups.get(key) || { key, n: 0, ex: [] }; g.n++; if (g.ex.length < 3) g.ex.push(i.d.name); groups.set(key, g);
  });
  if (!groups.size) return '';
  const list = [...groups.values()].sort((a, b) => b.n - a.n).slice(0, 40);
  return `<div class="card" style="background:var(--surface2)"><h3>Link unrecognised name groups to labs</h3>
  <p class="small muted">These devices share a naming prefix but didn’t match any lab. Pick the lab for each group; the prefix is saved as a match keyword on that lab, so this import and every future one links them automatically.</p>
  <table><thead><tr><th>Name group</th><th class="num">Devices</th><th>Examples</th><th>Lab</th></tr></thead><tbody>${list.map(g => `<tr><td><b>${esc(g.key)}</b></td><td class="num">${g.n}</td><td class="small muted">${esc(g.ex.join(', '))}</td><td><select data-grp="${esc(g.key)}"><option value="">— leave unassigned —</option>${optionsHTML(labOptions())}</select></td></tr>`).join('')}</tbody></table>

}

      if (e.target.dataset.map !== undefined) { I.map[e.target.dataset.map] = e.target.value; draw(); }
      if (e.target.dataset.opt) { I.opts[e.target.dataset.opt] = e.target.checked; draw(); }
    };
    const sv = $('#savemap', host);

      let n = 0;
      $$('[data-grp]', host).forEach(sel => {
        if (!sel.value) return; const lab = DB.get('labs', sel.value), key = sel.dataset.grp;
        const kws = new Set((lab.match || '').split(',').map(x => x.trim()).filter(Boolean)); kws.add(key);
        DB.put('labs', { ...lab, match: [...kws].join(', ') }); n++;
      });
      if (n) { DB.log(`Linked ${n} device-name groups to labs during import`); toast(`Saved ${n} name→lab mappings (kept as match keywords)`); }
      draw();
    };
    const ap = $('#apply', host); if (ap) ap.onclick = () => applyDeviceImport(I, items, draw);
  };

}
function applyDeviceImport(I, items, redraw, quiet) {
  const src = I.source, seen = new Set(), t = todayStr(); let nNew = 0, nUp = 0;
  const lineWarranty = new Map(); DB.data.hardware.forEach(l => { if (l.warrantyEnd) lineWarranty.set(l.labId + '|' + modelName(l).toLowerCase(), l.warrantyEnd); });
  items.forEach(({ d, ex, labId, action }) => {
    if (ex) seen.add(ex.id);
    if (action === 'same') return;
    if (src !== 'LabStats' && d.model) findOrCreateModel(d.model, d.platform, d.manufacturer);
    let patch;
    if (src === 'LabStats' && ex) {
      patch = { labId, group: d.tags || ex.group, lsSeen: d.lastCheckIn || ex.lsSeen };
      if (d.lastCheckIn && (!ex.lastCheckIn || d.lastCheckIn > ex.lastCheckIn)) patch.lastCheckIn = d.lastCheckIn;
    } else {
      patch = { name: d.name, serial: d.serial, model: d.model, manufacturer: d.manufacturer, platform: d.platform, os: d.os, osVersion: d.osVersion, ramGB: d.ramGB || '', storageGB: d.storageGB || '', lastCheckIn: d.lastCheckIn, user: d.user, location: d.location, tags: d.tags, labId, missing: false, lastImport: t };
      Object.keys(patch).forEach(k => { if (patch[k] === '' && ex && ex[k]) delete patch[k]; });
      if (!ex) patch.source = src;
      if (!(ex && ex.warrantyEnd)) { const w = lineWarranty.get(labId + '|' + (d.model || '').toLowerCase()); if (w) Object.assign(patch, { warrantyEnd: w, warrantySource: 'Old tracker', warrantyChecked: t }); }
    }
    DB.put('devices', { ...(ex || {}), ...patch }); ex ? nUp++ : nNew++;
  });
  let miss = 0;
  if (I.opts.missing) DB.data.devices.filter(x => x.source === src && !seen.has(x.id) && !x.missing).forEach(x => { DB.put('devices', { ...x, missing: true }); miss++; });
  DB.log(`Imported ${src} devices from ${I.fileName}: ${nNew} new, ${nUp} updated${miss ? `, ${miss} flagged missing` : ''}`);
  toast(`${src}: ${nNew} new, ${nUp} updated${miss ? `, ${miss} flagged missing` : ''}`);
  if (!quiet) { UI.impDev = { source: src, opts: I.opts }; location.hash = '#/devices'; }
  return `${nNew} new, ${nUp} updated${miss ? `, ${miss} flagged missing` : ''}`;
}

async function connectFolder(handle, readOnly) {
  if (readOnly) handle.ro = true;
  const store = new FolderStore(handle, readOnly);
  let disk = await store.read();
  if (!disk) {
    if (readOnly) throw new Error('No tracker data was found in that folder.');
    if (!confirm(`There is no tracker data in “${handle.name}” yet.\n\nCreate a new, empty tracker here? (Choose Cancel if you picked the wrong folder.)`)) return;
    const d = emptyData(); d.savedBy = DB.user; d.savedAt = new Date().toISOString(); d.saveId = uid();
    await store.write(JSON.stringify(d));
  }
  await startStore(store, null, readOnly);
}

async function startStore(store, seedFn, readOnly = false) {
  clearInterval(DB.pollTimer);
  DB.store = store; DB.readOnly = readOnly; DB.touched = {}; DB.baseRec = {}; DB.settingsTouched = {}; DB.notes = [];
  let disk;
  try { disk = await readChecked(store); }
  catch (e) {
    if (!e.damaged || store.kind !== 'folder' || readOnly) throw e;
    const bk = await store.listBackups();
    if (!bk.length) throw new Error('The data file is damaged (' + e.message + ') and no backups were found.');
    if (!confirm(`The shared data file is damaged:\n${e.message}\n\nRestore the most recent backup (${bk[0]})? The damaged file is kept next to it as lab-tracker-data.damaged-….json. Changes since that backup will be lost.`)) throw e;
    await store.keepDamaged(); await store.write(await store.readBackup(bk[0])); disk = await readChecked(store);
  }
  if (!disk && seedFn) { const d = seedFn(); d.savedAt = new Date().toISOString(); d.savedBy = 'Demo'; d.saveId = uid(); await store.write(JSON.stringify(d)); disk = await store.read(); }
  if (!disk) throw new Error('No data found.');
  DB.data = normalizeData(emptyData()); DB._idx = {};
  DB.adoptRemote(disk.data, disk.stamp);
  DB.storeRO = readOnly;
  $('#connect').hidden = true; $('#app').hidden = false;
  await identifyUser(); syncAutoProjects();
  DB.pollTimer = setInterval(() => DB.poll(), 15000);
  clearInterval(DB.impTimer); DB.impTimer = setInterval(() => checkImportFolder().catch(() => { }), 60000); setTimeout(() => checkImportFolder().catch(() => { }), 1500);
  if (!location.hash) location.hash = '#/dashboard';
  render();
}

function runSearch(q) {
  q = q.trim().toLowerCase(); const box = $('#gs-res');
  if (q.length < 2) { box.hidden = true; return; }
  let html = '', n = 0;
  for (const [t, label, rows, name, sub, href, hay] of SEARCH_KINDS) {
    const hits = rows().filter(r => (hay ? hay(r) : name(r) + ' ' + sub(r)).toLowerCase().includes(q)).slice(0, 6);
    if (!hits.length) continue; n += hits.length;
    html += `<div class="gh">${label}</div>` + hits.map(r => `<a href="${href ? href(r) : '#'}" data-open="${href ? '' : t + '|' + r.id}"><b>${esc(name(r))}</b><span class="muted small">${esc(sub(r))}</span></a>`).join('');
  }
  box.innerHTML = html || '<div class="none">No matches.</div>'; box.hidden = false;
}

    recordConfirmations(labs, state().to);
    DB.log(`Prepared replacement notice (${how}) for ${labs.map(labLabel).join(', ')}`);
  };
  const copyHTML = async () => {

    catch { const r = document.createRange(); r.selectNodeContents($('#n-prev', body)); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); const ok = document.execCommand('copy'); sel.removeAllRanges(); return ok; }
  };
  modal({

      { label: 'Copy formatted email', onClick: async () => { if (await copyHTML()) { log('copy'); toast('Copied — paste into a new email'); } else toast('Copy failed — select the preview and copy it by hand', 'err'); return false; } },
      { label: 'Open in email app', cls: 'primary', onClick: () => { const s = state(); let tx = s.text; const max = 1500; if (tx.length > max) tx = tx.slice(0, max) + '\n\n[Message shortened — use “Copy formatted email” for the full tables.]'; location.href = `mailto:${s.to.join(',')}?subject=${encodeURIComponent(s.subject)}&body=${encodeURIComponent(tx)}`; log('mailto'); return false; } }]
  });

function buildEml(s) {

// Lenovo warranty. Main route needs no key: build Lenovo's batch-upload file (.xlsx, max 1000 rows), upload it on Lenovo's batch warranty page,
// then import the exported results here. Optional route: the API with a ClientID (below). ASSUMPTIONS for the API route (not verified against Lenovo's own docs): GET https://supportapi.lenovo.com/v2.5/warranty?Serial=<serial>
// with a "ClientID" header; the JSON contains warranty entries with start/end dates. Lenovo issues the ClientID through your account rep.
// Browsers may block this call (CORS); tools/Get-LenovoWarranty.ps1 does the same lookup outside the browser and writes a CSV to import.
const LENOVO_API = 'https://supportapi.lenovo.com/v2.5/warranty';
const lenovoKey = () => { try { return localStorage.getItem('lt-lenovo-key') || ''; } catch { return ''; } };
const lenovoSupportUrl = serial => `https://pcsupport.lenovo.com/us/en/search?query=${encodeURIComponent(serial)}`;
const isLenovo = d => /lenovo/i.test(d.manufacturer || '') || /thinkcentre|thinkpad|thinkstation|ideapad|lenovo/i.test(d.model || '');

function collectWarranty(obj, acc = { starts: [], ends: [], names: [] }) {
  if (Array.isArray(obj)) obj.forEach(x => collectWarranty(x, acc));
  else if (obj && typeof obj === 'object') {
    for (const [k, v] of Object.entries(obj)) {
      if (typeof v === 'string') {
        if (/^(end|enddate|warrantyend|warrantyenddate|expirationdate|expiry)$/i.test(k)) acc.ends.push(normDate(v));
        else if (/^(start|startdate|warrantystart|warrantystartdate)$/i.test(k)) acc.starts.push(normDate(v));
        else if (/^(name|description|servicelevel)$/i.test(k) && v) acc.names.push(v);
      } else collectWarranty(v, acc);
    }
  }
  return acc;
}
async function lenovoLookup(serial) {
  const key = lenovoKey(); if (!key) throw Object.assign(new Error('Add your Lenovo ClientID in Settings first.'), { nokey: true });
  let res;
  try { res = await fetch(`${LENOVO_API}?Serial=${encodeURIComponent(serial)}`, { headers: { ClientID: key } }); }
  catch { throw Object.assign(new Error('The browser blocked the request to Lenovo (CORS or network). Use the helper script instead.'), { blocked: true }); }
  if (res.status === 401 || res.status === 403) throw new Error('Lenovo rejected the ClientID (HTTP ' + res.status + ').');
  if (!res.ok) throw new Error('Lenovo returned HTTP ' + res.status + ' for ' + serial);
  const w = collectWarranty(await res.json()), ends = w.ends.filter(Boolean).sort(), starts = w.starts.filter(Boolean).sort();
  if (!ends.length) throw new Error('No warranty dates found for ' + serial);
  return { end: ends[ends.length - 1], start: starts[0] || '', product: w.names[0] || '' };    // latest end date wins when several warranties exist
}
function saveWarranty(d, w, source) {
  DB.put('devices', { ...d, warrantyEnd: w.end, warrantyStart: w.start || d.warrantyStart || '', warrantyProduct: w.product || d.warrantyProduct || '', warrantyChecked: todayStr(), warrantySource: source });
}
async function lenovoLookupDevices(ids) {
  const devs = ids.map(id => DB.get('devices', id)).filter(d => d && d.serial);
  if (!devs.length) return toast('None of the selected devices has a serial number.', 'err');
  const body = document.createElement('div'); body.innerHTML = '<p id="lw-msg">Starting…</p><div class="meter"><i id="lw-bar" style="width:0"></i></div><pre class="small" id="lw-log" style="max-height:180px;overflow:auto"></pre>';
  let stop = false; const logEl = () => $('#lw-log', body);
  modal({ title: 'Lenovo warranty lookup', body, buttons: [{ label: 'Stop', onClick: () => { stop = true; return true; } }] });
  let ok = 0, fail = 0;
  for (let i = 0; i < devs.length && !stop; i++) {
    const d = devs[i]; $('#lw-msg', body) && ($('#lw-msg', body).textContent = `Looking up ${d.serial} (${i + 1} of ${devs.length})…`);
    try { const w = await lenovoLookup(d.serial); saveWarranty(d, w, 'Lenovo API'); ok++; logEl() && (logEl().textContent += `${d.serial}: ends ${w.end}\n`); }
    catch (e) { fail++; logEl() && (logEl().textContent += `${d.serial}: ${e.message}\n`); if (e.blocked || e.nokey) { stop = true; } }
    $('#lw-bar', body) && ($('#lw-bar', body).style.width = ((i + 1) / devs.length * 100) + '%');
    await sleep(1100);
  }
  if ($('#lw-msg', body)) $('#lw-msg', body).textContent = `Done: ${ok} updated, ${fail} failed.`;
  if (ok) DB.log(`Looked up Lenovo warranty for ${ok} devices`);
}

// ---- 12-xlsx.js
// Minimal .xlsx writer/reader with no libraries (zip "stored" entries out; DecompressionStream for reading).
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zipStore(files) {

    const nb = enc.encode(name), data = typeof content === 'string' ? enc.encode(content) : content, crc = crc32(data);
    const local = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0), ...u16(0), ...u16(0x21), ...u16(0x58), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)]);
    parts.push(local, nb, data);
    central.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), nb);
    offset += local.length + nb.length + data.length;
  }

  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);

}
// rows: array of arrays of strings/numbers. Text goes through sharedStrings for maximum compatibility with strict readers.
function writeXlsx(rows, sheetName = 'Sheet1') {
  const sst = [], sidx = new Map();
  const si = s => { if (!sidx.has(s)) { sidx.set(s, sst.length); sst.push(s); } return sidx.get(s); };
  const sheetRows = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
    if (v === '' || v == null) return '';
    const ref = colName(ci) + (ri + 1);
    return typeof v === 'number' ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="s"><v>${si(String(v))}</v></c>`;
  }).join('')}</row>`).join('');

  return zipStore([
    ['[Content_Types].xml', X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
    ['_rels/.rels', X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', X + `<workbook ${NS} xmlns:r="${R}"><sheets><sheet name="${xmlEsc(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', X + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${R}/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rId3" Type="${R}/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', X + `<styleSheet ${NS}><fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ['xl/sharedStrings.xml', X + `<sst ${NS} count="${sst.length}" uniqueCount="${sst.length}">${sst.map(s => `<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join('')}</sst>`],
    ['xl/worksheets/sheet1.xml', X + `<worksheet ${NS}><sheetData>${sheetRows}</sheetData></worksheet>`]
